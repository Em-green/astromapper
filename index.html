/* A restrained, static starlight layer. No motion or interference with input. */
.app{
  position:relative;
  isolation:isolate;
  background:
    radial-gradient(ellipse at 17% 15%,rgba(108,116,184,.14),transparent 44%),
    radial-gradient(ellipse at 76% 2%,rgba(100,147,197,.11),transparent 38%),
    radial-gradient(ellipse at 48% 46%,rgba(113,95,152,.035),transparent 38%);
}
.app::before{
  content:"";
  position:absolute;
  inset:0 0 auto;
  height:900px;
  max-height:100%;
  z-index:0;
  pointer-events:none;
  opacity:.52;
  background:
    radial-gradient(circle at 7% 18%,#d6e4ff 0 .8px,transparent 1.6px),
    radial-gradient(circle at 28% 8%,#e8ddf7 0 .7px,transparent 1.4px),
    radial-gradient(circle at 48% 13%,#bfd0ef 0 .7px,transparent 1.5px),
    radial-gradient(circle at 89% 22%,#e5e3f2 0 1px,transparent 1.8px),
    radial-gradient(circle at 95% 48%,#b9d9f2 0 .7px,transparent 1.4px),
    radial-gradient(circle at 5% 69%,#e3daf6 0 .9px,transparent 1.7px),
    radial-gradient(circle at 43% 59%,#bbd2ef 0 .6px,transparent 1.4px),
    radial-gradient(circle at 85% 81%,#d6d8ef 0 .8px,transparent 1.6px),
    radial-gradient(circle at 16% 88%,#d2e2ef 0 .6px,transparent 1.3px);
}
.topbar,.wrap,.footer{position:relative;z-index:1}
.intro h1 span{color:#c0d2f9}
@supports (background-clip:text){
  .intro h1 span{
    background:linear-gradient(105deg,#b6d1ff 4%,#d7c9ea 60%,#b7d8ed 98%);
    background-clip:text;
    -webkit-background-clip:text;
    color:transparent;
  }
}
.btn:not(.secondary){
  background:linear-gradient(110deg,#9abfff 0%,#b4c2f0 65%,#b7d1ed 100%);
  box-shadow:0 0 24px rgba(148,174,235,.08);
}
.btn:not(.secondary):hover{
  background:linear-gradient(110deg,#b0ceff 0%,#c4cff5 65%,#c5deef 100%);
}
.birthForm{box-shadow:0 26px 90px #0002,0 0 42px rgba(132,147,212,.035)}
.orbitalStars{filter:drop-shadow(0 0 4px rgba(201,212,247,.45))}
.natalDial{filter:drop-shadow(0 0 10px rgba(162,178,233,.10))}
@media(max-width:720px){.app::before{opacity:.38;height:780px}}

/* Restore the navy palette from the original uploaded app. */
:root{--bg:#0E1029;--bg2:#161A3D;--bg3:#1E2350;--line:#343953;--rust:#F1A0AA}
.app{background:radial-gradient(ellipse at 50% -10%,#1B1F4A 0%,#0E1029 55%)}
.panel{background:linear-gradient(145deg,#191E43,#141832)}
.themeTile,.rankCard{background:linear-gradient(145deg,#1E2350,#181D3E)}
.themeTile.active{background:linear-gradient(135deg,#2B335F,#202645)}
.themeResult,.eventCard{background:linear-gradient(145deg,#1B2247,#151B37)}
.matchBadge{display:flex;align-items:center;flex-wrap:wrap;gap:7px 10px;margin:0 0 12px;font-size:10px;line-height:1.8}
.matchStars{font-size:12px;letter-spacing:1px;white-space:nowrap}
.matchLabel{color:var(--accent)}
.match1 .matchLabel{color:var(--textdim)}
.fallbackTag{display:inline-block;padding:1px 7px;border:1px solid #496184;border-radius:5px;font-size:9px;color:#b7c9e2}
.matchLegend{display:flex;flex-wrap:wrap;align-items:center;gap:7px 18px;margin:0 0 18px;padding:14px 17px;border:1px solid var(--line);border-radius:9px;background:rgba(19,36,61,.65);font-size:11px;color:#c9d4e5}
.legendTitle{color:#e8edf6;font-weight:500}
.matchLegend .hint{flex-basis:100%;margin-top:2px;font-size:10px}
.rankBody .matchBadge{margin:8px 0 0}
.rankBody .lineMeta{display:block;margin-top:9px;font-size:10px;color:var(--textdim)}
@media(max-width:720px){.matchLegend{gap:6px 12px;padding:12px 14px}.matchLegend .legendTitle{flex-basis:100%}.rankCard{align-items:flex-start}.rankCard .rankNumber{margin-top:5px}.rankCard .arrow{align-self:center}}

/* Best / worst typography: solid text stars inherit their result color. */
.matchBadge.best .matchStars,.legendBest{color:var(--accent)}
.matchBadge.worst .matchStars,.legendWorst{color:var(--rust)}
.matchBadge.worst .matchLabel{color:var(--rust)}
.matchStars{font-family:var(--font-body);font-size:16px;letter-spacing:2px}
.legendScale{flex-basis:100%;color:var(--textdim)}
.bestHeading{border-left-color:var(--accent)}
.bestHeading h2,.bestHeading .eyebrow,.themeResult.best h3,.rankCard:not(.challenge) .cityName{color:var(--accent)}
.worstHeading{border-left-color:var(--rust)}
.worstHeading h2,.worstHeading .eyebrow,.themeResult.worst h3,.themeResult.worst .rankNumber,.themeResult.worst .textButton,.rankCard.challenge .cityName{color:var(--rust)}
.worstHeading .lede,.worstHeading .hint,.themeResult.worst>p,.rankCard.challenge .rankDescription{color:#DDB1BE}
.themeResult.worst{border-color:#694456;background:linear-gradient(145deg,#272039,#191B35)}
.themeResult.worst .lineMeta{color:#C6A3B2}
.themeHeading .eyebrow{color:inherit}
.themeHeading.bestHeading .eyebrow{color:var(--accent)}
.themeHeading.worstHeading .eyebrow{color:var(--rust)}
.lineRow.weak{opacity:.32}
.lineRow.relevant{opacity:1}

/* White headings and city names; result stars keep their blue/red accents. */
.bestHeading h2,.worstHeading h2,
.themeResult.best h3,.themeResult.worst h3,
.rankCard:not(.challenge) .cityName,.rankCard.challenge .cityName,
.cityDetail .cardTitle,.cityDetail h2{color:#FFFFFF}

/* Make the related lines easier to read, with weaker lines in the background. */
.planetRowHeading{display:flex;align-items:center;flex-wrap:wrap;gap:7px 10px}
.lineRow.relevant .hint{color:#D8DEED}

/* Original starlight and a restrained violet / rose nebula over the navy base. */
.app{
  background:
    radial-gradient(ellipse at 3% 57%,rgba(149,71,128,.24),transparent 45%),
    radial-gradient(ellipse at 38% 88%,rgba(113,86,164,.22),transparent 46%),
    radial-gradient(ellipse at 84% 9%,rgba(63,83,141,.15),transparent 39%),
    radial-gradient(ellipse at 50% -10%,#1B1F4A 0%,#0E1029 55%);
}
.app::before{display:none}
.starField{position:absolute;inset:0 0 auto;width:100%;height:100%;max-height:1500px;z-index:0;pointer-events:none;opacity:.75;overflow:hidden}
.orbitalArt{width:min(100%,390px);margin:16px auto 16px;filter:drop-shadow(0 0 17px rgba(170,154,213,.08))}
.footer{flex-wrap:wrap;gap:10px 20px}
.creatorCredit{flex-basis:100%;text-align:center;margin-top:13px;font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;color:#928ca9}
.creatorCredit strong{font-weight:500;color:#c5bfd7}
@media(max-width:720px){
  .orbitalArt{position:relative;right:auto;top:auto;width:265px;max-width:85%;margin:14px auto 6px;opacity:.9}
  .introStats{width:100%;margin-top:14px}
  .starField{opacity:.6}
}

/* Nearby points share a ranking slot while every city's result stays visible. */
.registryInfo{margin:0 0 26px}
.registryRegion{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.registryRegion>strong{color:var(--text);font-size:12px}
.areaRepresentative{display:block;font-size:10px!important;color:var(--textdim)!important;margin:6px 0 10px;line-height:1.7}
.rankBody .areaRepresentative{margin:3px 0 0}
.rankArea{border:1px solid var(--line);border-radius:10px;background:#171D3C;overflow:hidden}
.rankArea>summary{list-style:none;border:0;border-radius:0}
.rankArea>summary::-webkit-details-marker,.themeAreaDetails>summary::-webkit-details-marker{display:none}
.rankArea[open]>summary{border-bottom:1px solid var(--line)}
.rankArea[open]>summary .arrow{transform:rotate(180deg)}
.areaMembers{padding:3px 20px 18px}
.areaMember{border-top:1px solid var(--line);padding-top:16px;margin-top:14px}
.areaMember h4{font-size:15px;font-weight:500;color:#fff;margin:0 0 8px}
.areaMember .matchBadge{margin-bottom:6px}
.areaMember .lineMeta{font-size:10px;color:var(--textdim);line-height:1.7}
.areaMember .textButton{margin-top:6px}
.areaMember.worst .textButton{color:var(--rust)}
.themeAreaDetails{width:100%;margin-top:auto}
.themeAreaDetails>summary{font-size:11px;color:var(--accent);padding:6px 0;list-style:none}
.themeAreaDetails>summary::after{content:" ⌄"}
.themeResult.worst .themeAreaDetails>summary{color:var(--rust)}
.themeAreaDetails .areaMembers{padding:0}
.themeAreaDetails .areaMember>p{font-size:11px}
.themeResults{align-items:start}
.themeResult{height:auto}
@media(max-width:720px){.areaMembers{padding:3px 16px 16px}.rankArea>summary{padding:18px}.registryInfo{font-size:11px}}
</style>

<noscript>このツールにはJavaScriptが必要です。ブラウザの設定で有効にしてください。</noscript>

<script>
if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
  document.getElementById('root').textContent = '読み込みに失敗しました。インターネット接続を確認して、ページを再読み込みしてください。';
} else {
const { useState, useMemo } = React;

const D2R = Math.PI / 180, R2D = 180 / Math.PI;
function rev(x) { x = x % 360; if (x < 0) x += 360; return x; }
function norm180(x) { while (x > 180) x -= 360; while (x < -180) x += 360; return x; }

function julianDate(y, m, day, h) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + B - 1524.5 + h / 24;
}

function elementsFor(planet, d) {
  switch (planet) {
    case "Sun": return { N: 0, i: 0, w: rev(282.9404 + 4.70935e-5 * d), a: 1.0, e: 0.016709 - 1.151e-9 * d, M: rev(356.0470 + 0.9856002585 * d) };
    case "Moon": return { N: rev(125.1228 - 0.0529538083 * d), i: 5.1454, w: rev(318.0634 + 0.1643573223 * d), a: 60.2666, e: 0.0549, M: rev(115.3654 + 13.0649929509 * d) };
    case "Mercury": return { N: rev(48.3313 + 3.24587e-5 * d), i: 7.0047 + 5.0e-8 * d, w: rev(29.1241 + 1.01444e-5 * d), a: 0.387098, e: 0.205635 + 5.59e-10 * d, M: rev(168.6562 + 4.0923344368 * d) };
    case "Venus": return { N: rev(76.6799 + 2.4659e-5 * d), i: 3.3946 + 2.75e-8 * d, w: rev(54.891 + 1.38374e-5 * d), a: 0.72333, e: 0.006773 - 1.302e-9 * d, M: rev(48.0052 + 1.6021302244 * d) };
    case "Mars": return { N: rev(49.5574 + 2.11081e-5 * d), i: 1.8497 - 1.78e-8 * d, w: rev(286.5016 + 2.92961e-5 * d), a: 1.523688, e: 0.093405 + 2.516e-9 * d, M: rev(18.6021 + 0.5240207766 * d) };
    case "Jupiter": return { N: rev(100.4542 + 2.76854e-5 * d), i: 1.303 - 1.557e-7 * d, w: rev(273.8777 + 1.64505e-5 * d), a: 5.20256, e: 0.048498 + 4.469e-9 * d, M: rev(19.895 + 0.0830853001 * d) };
    case "Saturn": return { N: rev(113.6634 + 2.3898e-5 * d), i: 2.4886 - 1.081e-7 * d, w: rev(339.3939 + 2.97661e-5 * d), a: 9.55475, e: 0.055546 - 9.499e-9 * d, M: rev(316.967 + 0.0334442282 * d) };
    case "Uranus": return { N: rev(74.0005 + 1.3978e-5 * d), i: 0.7733 + 1.9e-8 * d, w: rev(96.6612 + 3.0565e-5 * d), a: 19.18171 - 1.55e-8 * d, e: 0.047318 + 7.45e-9 * d, M: rev(142.5905 + 0.011725806 * d) };
    case "Neptune": return { N: rev(131.7806 + 3.0173e-5 * d), i: 1.77 - 2.55e-7 * d, w: rev(272.8461 - 6.027e-6 * d), a: 30.05826 + 3.313e-8 * d, e: 0.008606 + 2.15e-9 * d, M: rev(260.2471 + 0.005995147 * d) };
    default: return null;
  }
}
function plutoElements(T) {
  const a = 39.48211675 - 0.00031596 * T, e = 0.2488273 + 0.0000517 * T, i = 17.14001206 + 0.00004818 * T;
  const L = rev(238.92903833 + 145.20780515 * T), peri = rev(224.06891629 - 0.04062942 * T), N = rev(110.30393684 - 0.01183482 * T);
  return { N, i, w: rev(peri - N), a, e, M: rev(L - peri) };
}
function solveKepler(M, e) {
  let E = M * D2R; const Mr = M * D2R;
  for (let it = 0; it < 50; it++) {
    const dE = (E - e * Math.sin(E) - Mr) / (1 - e * Math.cos(E));
    E -= dE; if (Math.abs(dE) < 1e-9) break;
  }
  return E;
}
function helioXYZ(el) {
  const { N, i, w, a, e, M } = el;
  const E = solveKepler(M, e);
  const xv = a * (Math.cos(E) - e), yv = a * (Math.sqrt(1 - e * e) * Math.sin(E));
  const v = rev(Math.atan2(yv, xv) * R2D), r = Math.sqrt(xv * xv + yv * yv);
  const Nr = N * D2R, ir = i * D2R, wv = (v + w) * D2R;
  const xh = r * (Math.cos(Nr) * Math.cos(wv) - Math.sin(Nr) * Math.sin(wv) * Math.cos(ir));
  const yh = r * (Math.sin(Nr) * Math.cos(wv) + Math.cos(Nr) * Math.sin(wv) * Math.cos(ir));
  const zh = r * (Math.sin(wv) * Math.sin(ir));
  return { x: xh, y: yh, z: zh };
}

// Core: given a Julian Date (UT), return ecliptic lon/lat, RA/Dec for all 10 bodies + GST(deg)
function computePositionsJD(JD) {
  const d = JD - 2451543.5;
  const T = (JD - 2451545.0) / 36525;

  const sunEl = elementsFor("Sun", d);
  const Esun = solveKepler(sunEl.M, sunEl.e);
  const xs = sunEl.a * (Math.cos(Esun) - sunEl.e), ys = sunEl.a * Math.sqrt(1 - sunEl.e * sunEl.e) * Math.sin(Esun);
  const sunLon = rev(Math.atan2(ys, xs) * R2D + sunEl.w);
  const sunDist = Math.sqrt(xs * xs + ys * ys);
  const xEarth = -sunDist * Math.cos(sunLon * D2R), yEarth = -sunDist * Math.sin(sunLon * D2R);

  const out = {};
  out.Sun = { lon: sunLon, lat: 0 };

  const moonEl = elementsFor("Moon", d);
  const moonH = helioXYZ(moonEl);
  let moonLon = rev(Math.atan2(moonH.y, moonH.x) * R2D);
  let moonLat = R2D * Math.atan2(moonH.z, Math.sqrt(moonH.x * moonH.x + moonH.y * moonH.y));
  const Ms = sunEl.M, Mm = moonEl.M, Nm = moonEl.N;
  const Lm = rev(Mm + moonEl.w + Nm), Ls = rev(Ms + sunEl.w), Dm = rev(Lm - Ls);
  moonLon = rev(moonLon
    - 1.274 * Math.sin((Mm - 2 * Dm) * D2R) + 0.658 * Math.sin(2 * Dm * D2R)
    - 0.186 * Math.sin(Ms * D2R) - 0.059 * Math.sin((2 * Mm - 2 * Dm) * D2R)
    - 0.057 * Math.sin((Mm - 2 * Dm + Ms) * D2R) + 0.053 * Math.sin((Mm + 2 * Dm) * D2R)
    + 0.046 * Math.sin((2 * Dm - Ms) * D2R) + 0.041 * Math.sin((Mm - Ms) * D2R)
    - 0.035 * Math.sin(Dm * D2R) - 0.031 * Math.sin((Mm + Ms) * D2R)
    - 0.015 * Math.sin((2 * Nm - 2 * Dm) * D2R) + 0.011 * Math.sin((Mm - 4 * Dm) * D2R));
  moonLat = moonLat
    - 0.173 * Math.sin((Nm - 2 * Dm) * D2R) - 0.055 * Math.sin((Mm - Nm - 2 * Dm) * D2R)
    - 0.046 * Math.sin((Mm + Nm - 2 * Dm) * D2R) + 0.033 * Math.sin((Nm + 2 * Dm) * D2R)
    + 0.017 * Math.sin((2 * Mm + Nm) * D2R);
  out.Moon = { lon: moonLon, lat: moonLat };

  for (const p of ["Mercury", "Venus", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"]) {
    const h_ = helioXYZ(elementsFor(p, d));
    const xg = h_.x - xEarth, yg = h_.y - yEarth, zg = h_.z;
    out[p] = { lon: rev(Math.atan2(yg, xg) * R2D), lat: R2D * Math.atan2(zg, Math.sqrt(xg * xg + yg * yg)) };
  }
  const plH = helioXYZ(plutoElements(T));
  {
    const xg = plH.x - xEarth, yg = plH.y - yEarth, zg = plH.z;
    out.Pluto = { lon: rev(Math.atan2(yg, xg) * R2D), lat: R2D * Math.atan2(zg, Math.sqrt(xg * xg + yg * yg)) };
  }

  const oblq = 23.4393 - 3.563e-7 * d;
  const oblr = oblq * D2R;
  const gst = rev(280.46061837 + 360.98564736629 * (JD - 2451545.0) + 0.000387933 * T * T - (T * T * T) / 38710000);
  for (const k of Object.keys(out)) {
    const lonr = out[k].lon * D2R, latr = out[k].lat * D2R;
    out[k].ra = rev(R2D * Math.atan2(Math.sin(lonr) * Math.cos(oblr) - Math.tan(latr) * Math.sin(oblr), Math.cos(lonr)));
    out[k].dec = R2D * Math.asin(Math.sin(latr) * Math.cos(oblr) + Math.cos(latr) * Math.sin(oblr) * Math.sin(lonr));
  }
  return { bodies: out, gst };
}

// MC/IC longitude for a body, given natal RA + natal GST
function mcIcLon(ra, gst) {
  const mc = norm180(ra - gst);
  return { mc, ic: norm180(mc + 180) };
}
// AC/DC latitude at a given geographic longitude
function acDcLat(ra, dec, gst, lon) {
  const H = norm180(gst + lon - ra);
  const decr = dec * D2R;
  if (Math.abs(Math.tan(decr)) < 1e-9) return null;
  const tphi = -Math.cos(H * D2R) / Math.tan(decr);
  return { phi: R2D * Math.atan(tphi), kind: H < 0 ? "AC" : "DC" };
}

  const favHits = PLANETS.filter(p => p.cat === "fav").map(p => ({ p, info: dist[p.key] })).filter(x => x.info.dist < ORB).sort((a, b) => a.info.dist - b.info.dist);
  const chaHits = PLANETS.filter(p => p.cat === "cha").map(p => ({ p, info: dist[p.key] })).filter(x => x.info.dist < ORB).sort((a, b) => a.info.dist - b.info.dist);
  if (favHits.length === 0 && chaHits.length === 0) {
    return { tone: "neutral", text: "目立った天体ラインは通っていません。良くも悪くもなく、特別な引力を感じにくい\"フラットな\"場所のようです。" };
  }
  if (favHits.length > 0 && chaHits.length === 0) {
    const top = favHits[0];
    return { tone: "fav", text: `${PMETA[top.p.key].name}${top.info.type}が強く効いています（誤差${top.info.dist.toFixed(1)}°）。${LINE_DESC[top.p.key][top.info.type]}だと考えられます。` };
  }
  if (chaHits.length > 0 && favHits.length === 0) {
    const top = chaHits[0];
    return { tone: "cha", text: `${PMETA[top.p.key].name}${top.info.type}が強く効いています（誤差${top.info.dist.toFixed(1)}°）。${LINE_DESC[top.p.key][top.info.type]}と言えそうです。刺激的ですが、ゆったり過ごすには向かないかもしれません。` };

const AREA_RADIUS_KM=80;
function cityDistanceKm(a,b){
  const dlat=(b.lat-a.lat)*D2R,dlon=(b.lon-a.lon)*D2R;
  const d=Math.sin(dlat/2)**2+Math.cos(a.lat*D2R)*Math.cos(b.lat*D2R)*Math.sin(dlon/2)**2;
  return 6371*2*Math.asin(Math.min(1,Math.sqrt(d)));
}

  for(const city of cities){

    if(area)area.members.push(city);else areas.push({id:city.name,country:city.country,members:[city]});

const ORB = 9; // degrees, for best/worst scoring
function lineDistances(natal, lat, lon) {
  // returns { bodyKey: {type, dist} } -- best (smallest) line per body at this location
  const res = {};
  for (const p of PLANETS) {
    const b = natal.bodies[p.key];
    const { mc, ic } = mcIcLon(b.ra, natal.gst);
    const candidates = [
      { type: "MC", dist: Math.abs(norm180(lon - mc)) },
      { type: "IC", dist: Math.abs(norm180(lon - ic)) },
    ];
    const adac = acDcLat(b.ra, b.dec, natal.gst, lon);
    if (adac) candidates.push({ type: adac.kind, dist: Math.abs(adac.phi - lat) });
    candidates.sort((a, b2) => a.dist - b2.dist);
    res[p.key] = candidates[0];
  }
  return res;
}
function scoreCity(natal, city) {
  const dist = lineDistances(natal, city.lat, city.lon);
  let fav = 0, cha = 0, peakFav = 0, peakCha = 0;
  for (const p of PLANETS) {
    const d = dist[p.key].dist;
    const contrib = Math.max(0, ORB - d);
    if (p.cat === "fav") { fav += contrib; if (contrib > peakFav) peakFav = contrib; }
    if (p.cat === "cha") { cha += contrib; if (contrib > peakCha) peakCha = contrib; }
  }
  return { dist, fav, cha, peakFav, peakCha };
}

========================================================= */
const TRANSIT_BODIES = ["Mars", "Jupiter", "Saturn", "Uranus", "Neptune", "Pluto"];
const TRANSIT_ORB = 3;

function scanTransits(natal, startJD, totalDays) {
  // daily scan; group consecutive hit-days per (transitBody, natalBody)
  const active = {}; // key -> {startIdx, minDiff, peakIdx}
  const events = [];
  for (let day = 0; day <= totalDays; day++) {
    const JD = startJD + day;
    const pos = computePositionsJD(JD);
    for (const tb of TRANSIT_BODIES) {
      const tlon = pos.bodies[tb].lon;
      for (const p of PLANETS) {
        const nlon = natal.bodies[p.key].lon;
        const diff = Math.abs(norm180(tlon - nlon));
        const key = tb + "_" + p.key;
        if (diff <= TRANSIT_ORB) {
          if (!active[key]) active[key] = { startDay: day, minDiff: diff, peakDay: day };
          if (diff < active[key].minDiff) { active[key].minDiff = diff; active[key].peakDay = day; }
          active[key].endDay = day;
        } else if (active[key]) {
          events.push({ transit: tb, natal: p.key, ...active[key] });
          delete active[key];
        }
      }
    }
  }
  for (const key of Object.keys(active)) {
    const parts = key.split("_");
    events.push({ transit: parts[0], natal: parts[1], ...active[key] });
  }
  events.sort((a, b) => a.startDay - b.startDay);
  return events.map(e => ({
    ...e,
    startDate: new Date((startJD + e.startDay - 2440587.5) * 86400000),
    endDate: new Date((startJD + e.endDay - 2440587.5) * 86400000),
    peakDate: new Date((startJD + e.peakDay - 2440587.5) * 86400000),
  }));
}

function bestCityForBody(natal, bodyKey) {
  let best = null;
  for (const city of CITY_DB) {
    const d = lineDistances(natal, city.lat, city.lon)[bodyKey];
    if (!best || d.dist < best.dist) best = { city, ...d };
  }
  return best;
}
